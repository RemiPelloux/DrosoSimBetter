<main class="flex min-h-screen flex-col items-center justify-center bg-[#F6F4EE] px-6 text-center">
  <ds-drosophila [size]="72" />
  <p class="mt-6 text-xs font-bold uppercase tracking-[0.3em] text-emerald-700">Erreur 404</p>
  <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900">Cette page s'est envolée</h1>
  <p class="mt-3 max-w-md text-sm text-slate-600">L'adresse demandée n'existe pas ou a été déplacée. Revenez au simulateur ou consultez la documentation.</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a routerLink="/simulator" class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-bold text-white hover:bg-slate-800">Ouvrir le simulateur</a>
    <a routerLink="/docs/presentation" class="rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">Documentation</a>
    <a routerLink="/" class="rounded-xl px-5 py-3 text-sm font-bold text-slate-500 hover:text-slate-800">Accueil</a>
  </div>
</main>
